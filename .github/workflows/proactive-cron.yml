name: Proactive Cron

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trigger-proactive-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Call Proactive API
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/proactive?secret=${{ secrets.CRON_SECRET }}"
