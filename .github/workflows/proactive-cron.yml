name: Proactive Messaging Cron

on:
  schedule:
    # Runs at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  proactive-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call Proactive API
        run: |
            curl -X GET "${{ secrets.APP_URL }}/api/cron/proactive?secret=${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
